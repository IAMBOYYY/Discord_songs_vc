    # Check https://github.com/lavalink-devs/youtube-source for the newest version
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.3"
      snapshot: false
  server:
    password: "youshallnotpass"
    sources:
      youtube: false   # the plugin replaces the built-in YouTube source
